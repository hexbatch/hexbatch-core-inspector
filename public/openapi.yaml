openapi: 3.1.0
info:
  title: 'Hexbatch core inspector'
  description: 'Testing api for hexbatch'
  termsOfService: 'https://hexbatch.com/core-inspector'
  contact:
    name: Hexbatch
    url: 'https://hexbatch.com'
  license:
    name: 'MIT License'
    identifier: MIT
  version: 0.1.0
servers:
  -
    url: 'http://localhost:8081'
    description: 'This tests on the local host'
paths:
  /api/v1/app/about:
    get:
      tags:
        - app
      summary: 'Returns app information'
      description: 'This returns information about the app, including versions of each component'
      operationId: api.app.about
      responses:
        '200':
          description: 'Gives information about the app'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AboutResponse'
        '400':
          description: 'When something happened'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                message: Unexpected.
      security:
        -
          bearerAuth: []
  /api/v1/users/login:
    post:
      tags:
        - user
      summary: 'Logs the user in'
      description: 'This returns a token to use as basic auth in the other api calls'
      operationId: api.users.login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginParams'
      responses:
        '200':
          description: 'Login returns a token'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: 'Bad credentials'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 422
                message: 'These credentials do not match our records'
  /api/v1/users/me:
    get:
      tags:
        - user
      summary: 'Returns logged-in user information'
      description: 'This returns user data about the person this authentication token is for'
      operationId: api.users.me
      responses:
        '200':
          description: 'Gives information about the logged in user'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: 'When not logged in'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                message: Unauthenticated.
      security:
        -
          bearerAuth: []
  /api/hbc-things/v1/hooks/list:
    get:
      tags:
        - hook
      summary: 'List all the hooks registered to this owner'
      description: ''
      operationId: hbc-things.hooks.list
      responses:
        '200':
          description: 'The hook list'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookCollectionResponse'
        '400':
          description: 'When not logged in'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                message: Unauthenticated.
      security:
        -
          bearerAuth: []
  /api/hbc-things/v1/hooks/admin/list:
    get:
      tags:
        - hook
        - admin
      summary: 'List all the hooks'
      description: ''
      operationId: hbc-things.hooks.admin.list
      responses:
        '200':
          description: 'The hook list'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookCollectionResponse'
        '400':
          description: 'When not logged in'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                message: Unauthenticated.
        '403':
          description: 'When not admin'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 403
                message: 'Not an admin.'
      security:
        -
          bearerAuth: []
  '/api/hbc-things/v1/hooks/admin/{thing_hook}/destroy':
    delete:
      tags:
        - hook
        - admin
      summary: 'Removes a hook'
      description: ''
      operationId: hbc-things.hooks.admin.destroy
      parameters:
        -
          name: thing_hook
          in: path
          description: 'uuid of the hook'
          required: true
          allowEmptyValue: false
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: 'The shown hook'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HookResponse'
        '400':
          description: 'When not logged in'
          content:
            application/json:
              schema:
