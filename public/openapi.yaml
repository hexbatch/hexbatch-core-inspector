components:
  schemas:
    AboutResponse:
      title: User
      description: 'This can describe a user or employee or someone who is both'
      properties:
        app_version:
          title: 'App version'
          type: string
          example: '1.1'
        thing_version:
          title: 'Thing version'
          type: string
          example: 2.0.9
      type: object
    ErrorResponse:
      title: Error
      description: 'All errors will have this format'
      properties:
        status:
          title: 'The status of the error '
          description: 'This is normally a http code'
          type: integer
          example: 400
        message:
          title: 'The error message '
          description: 'Describes the problem'
          type: string
          example: 'You have not been assigned to this project'
      type: object
      example:
        status: 401
        message: 'Logged in user is not assigned to the project'
    LoginParams:
      title: 'Login Data'
      description: 'Login requires a username and password'
      required:
        - username
        - password
      properties:
        username:
          title: 'User name'
          type: string
          maxLength: 30
          minLength: 3
          example: dobby_1987
        password:
          title: Password
          type: string
          format: password
          example: beans_r_88good
      type: object
      example:
        username: will
        password: past-pass-power
        device_token: c2pIsrDb4v6cZS6u4uNYhx1v3sBibXci1_zI_BCb
    LoginResponse:
      title: 'Login response'
      description: 'Returns the token that is required by other api calls'
      properties:
        auth_token:
          title: 'Auth Token'
          type: string
          format: password
          example: 4|6u2HE63lbItRImAklzn96Axf1zUzXYYHOFotGLLR4fb81fa0
      type: object
    UserResponse:
      title: User
      description: 'This can describe a user or employee or someone who is both'
      properties:
        user_id:
          title: 'User Id'
          type:
            - integer
            - 'null'
          example: 58
        name:
          title: Name
          type:
            - string
            - 'null'
          example: Will
        username:
          title: Username
          type:
            - string
            - 'null'
          example: Will
        email:
          title: Email
          type:
            - string
            - 'null'
          format: email
          example: willtornweed@yarn.org
        user_tags:
          title: Tags
          description: $user_tags
          type: array
          items:
            type: string
        registration_date:
          title: 'Registration Date'
          type:
            - string
            - 'null'
          format: date-time
          example: '2015-08-12T00:00:00-05:00'
      type: object
    TypeOfCallback:
      description: 'postgres enum type_of_thing_callback'
      type: string
      enum:
        - DISABLED
        - HTTP_GET
        - HTTP_POST
        - HTTP_POST_FORM
        - HTTP_POST_JSON
        - HTTP_PUT
        - HTTP_PUT_FORM
        - HTTP_PUT_JSON
        - HTTP_PATCH
        - HTTP_PATCH_FORM
        - HTTP_PATCH_JSON
        - HTTP_DELETE
        - HTTP_DELETE_FORM
        - HTTP_DELETE_JSON
        - CODE
        - EVENT_CALL
    TypeOfCallbackStatus:
      description: 'postgres enum type_of_thing_callback_status'
      type: string
      enum:
        - BUILDING
        - WAITING
        - CALLBACK_SUCCESSFUL
        - CALLBACK_ERROR
    TypeOfHookMode:
      description: 'postgres enum type_of_thing_hook_mode'
      type: string
      enum:
        - NONE
        - NODE
        - NODE_FAILURE
        - NODE_SUCCESS
        - NODE_FINALLY
    TypeOfThingStatus:
      description: 'postgres enum type_of_thing_status'
      type: string
      enum:
        - THING_BUILDING
        - THING_PENDING
        - THING_RUNNING
        - THING_SHORT_CIRCUITED
        - THING_SUCCESS
        - THING_FAIL
        - THING_INVALID
        - THING_ERROR
    CallbackCollectionResponse:
      title: Callbacks
      description: 'A collection of hooks'
      properties:
        callbacks:
          title: 'List of Callbacks'
          description: $callbacks
          type: array
          items:
            $ref: '#/components/schemas/CallbackResponse'
        next_page:
          title: 'Next results'
          type:
            - string
            - 'null'
          format: url
        previous_page:
          title: 'Previous results'
          type:
            - string
            - 'null'
          format: url
      type: object
    CallbackResponse:
      title: Callback
      description: 'Show a Hook'
      properties:
        uuid:
          title: Self
          type: string
          format: uuid
        hook_uuid:
          title: Hook
          type: string
          format: uuid
        thing_uuid:
          title: Thing
          type: string
          format: uuid
        error:
          oneOf:
            -
              $ref: '#/components/schemas/ThingErrorResponse'
            -
              type: 'null'
          title: Error
        code:
          title: 'Code of response'
          type: integer
        response:
          title: 'Response of callback'
          description: $response
          type:
            - array
            - 'null'
          items: {  }
        headers_sent:
          title: 'Headers sent'
          description: $headers_sent
          type:
            - array
            - 'null'
          items: {  }
        data_sent:
          title: 'Data sent'
          description: $data_sent
          type:
            - array
            - 'null'
          items: {  }
        status:
          $ref: '#/components/schemas/TypeOfCallbackStatus'
        hook:
          oneOf:
            -
              $ref: '#/components/schemas/HookResponse'
            -
              type: 'null'
          title: Hook
        thing:
          oneOf:
            -
              $ref: '#/components/schemas/ThingResponse'
            -
              type: 'null'
          title: Thing
        ran_at:
          title: 'Ran at'
          description: 'Iso 8601 datetime string for when this ran'
          type:
            - string
            - 'null'
          format: datetime
          example: '2025-01-25T15:00:59-06:00'
      type: object
    ThingErrorResponse:
      title: Error
      description: 'Show a Hook'
      properties:
        code:
          title: Code
          type: integer
        message:
          title: Message
          type: string
        uuid:
          title: Self
          type: string
          format: uuid
        time:
          title: Time
          description: 'Iso 8601 datetime string for when error happened'
          type:
            - string
            - 'null'
          format: datetime
